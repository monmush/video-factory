appId: com.m5studio.app
productName: M5 Studio
directories:
  output: dist
  buildResources: build
extraMetadata:
  main: ./out-package/main/index.js
files:
  - out-package/**
  - package.json
  - resources/fixtures/**
  - "!**/*.map"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asarUnpack: []
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64]
  identity: "-"
  hardenedRuntime: false
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
publish: null
